{% extends "layout.html" %}

{% block body %}
    <p class="subtitle">Enter your details to calculate your Body Mass Index.</p>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form action="/result" method="post">
        <label for="weight">Weight (kg)</label>
        <input id="weight" name="weight" type="text" placeholder="e.g. 70" autofocus>

        <label for="height">Height (cm)</label>
        <input id="height" name="height" type="text" placeholder="e.g. 175">

        <button type="submit">Calculate</button>
    </form>
{% endblock %}
